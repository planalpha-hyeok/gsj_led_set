# Windows 실행 파일 자동 빌드 + 테스트
# 결과물: Actions 실행 화면의 Artifacts 에서 gsj_led_player-windows 다운로드

name: build-windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Qt 설치
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: FFmpeg 다운로드 (LGPL shared)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "gsj-led-player-ci" }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest"
          # 버전 고정 빌드(nX.Y) 중 8.x 우선, 없으면 가장 높은 버전
          $candidates = $release.assets |
            Where-Object { $_.name -match '^ffmpeg-n\d+\.\d+-latest-win64-lgpl-shared-\d+\.\d+\.zip$' } |
            Sort-Object { [version](($_.name -replace '^ffmpeg-n(\d+\.\d+).*$', '$1')) } -Descending
          $asset = $candidates | Where-Object { $_.name -match '^ffmpeg-n8\.' } | Select-Object -First 1
          if (-not $asset) { $asset = $candidates | Select-Object -First 1 }
          if (-not $asset) {
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "FFmpeg LGPL shared 빌드를 찾을 수 없음"
          }
          Write-Host "FFmpeg: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $dir = (Get-ChildItem ffmpeg_dl -Directory | Select-Object -First 1).FullName
          "FFMPEG_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 구성 (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: 빌드
        run: cmake --build build --config Release --parallel

      - name: 테스트
        run: ctest --test-dir build -C Release --output-on-failure

      - name: 배포 폴더 만들기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\bin\Release\gsj_led_player.exe dist\
          Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" dist\
          windeployqt --release --no-translations --no-opengl-sw dist\gsj_led_player.exe
          Copy-Item README.md dist\
          Copy-Item "$env:FFMPEG_ROOT\LICENSE.txt" dist\FFMPEG_LICENSE.txt -ErrorAction SilentlyContinue

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: gsj_led_player-windows
          path: dist
          retention-days: 30
